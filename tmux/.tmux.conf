# ============================================================================
# GENERAL SETTINGS
# ============================================================================

# Reload config file with prefix + r
unbind r
bind r source-file ~/.tmux.conf

# Start window numbering at 1 instead of 0
set -g base-index 1

# ============================================================================
# PREFIX KEY
# ============================================================================

# Set the global prefix key to CTRL or Control + s
set -g prefix C-s

# ============================================================================
# MOUSE SUPPORT
# ============================================================================

# Enable mouse support (allows resizing panes with mouse)
set -g mouse on

# ============================================================================
# PANE NAVIGATION
# ============================================================================

# Vim-style pane navigation using h j k l
bind-key h select-pane -L  # Move to left pane
bind-key j select-pane -D  # Move to pane below
bind-key k select-pane -U  # Move to pane above
bind-key l select-pane -R  # Move to right pane

# ============================================================================
# STATUS BAR
# ============================================================================

# Set status bar background to default (transparent)
set -g status-style bg=default

# Clear default status bar sections
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application} #{E:@catppuccin_status_session}"

# ============================================================================
# PLUGIN MANAGER (TPM)
# ============================================================================

# Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'catppuccin/tmux#v2.1.0'

# ============================================================================
# PLUGIN CONFIGURATION - Catppuccin Theme
# ============================================================================

# Window format for current window
set -g @catppuccin_window_current_text " #{window_name}"

# Window format for inactive windows
set -g @catppuccin_window_text " #{window_name}"

# ============================================================================
# INITIALIZE PLUGIN MANAGER
# ============================================================================

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'