# ============================================================================
# GENERAL SETTINGS
# ============================================================================

# Reload config file with prefix + r
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Start window numbering at 1 instead of 0
set -g base-index 1

# Ghostty / modern terminals: advertise 256 colors + true color inside panes (Neovim, themes)
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"

# Snappy prefix; focus events for Neovim et al. when switching tmux panes; OSC 52 clipboard
set -sg escape-time 0
set -g focus-events on
set -g set-clipboard on

# ============================================================================
# PREFIX KEY
# ============================================================================

# Set the global prefix key to CTRL or Control + s
set -g prefix C-s

# ============================================================================
# MOUSE SUPPORT
# ============================================================================

# Enable mouse support (allows resizing panes with mouse)
set -g mouse on

# ============================================================================
# PANE NAVIGATION
# ============================================================================

# Vim-style pane navigation using h j k l
bind-key h select-pane -L  # Move to left pane
bind-key j select-pane -D  # Move to pane below
bind-key k select-pane -U  # Move to pane above
bind-key l select-pane -R  # Move to right pane

# ============================================================================
# PLUGIN MANAGER (TPM)
# ============================================================================

# Tmux Plugin Manager
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'catppuccin/tmux#v2.1.0'

# ============================================================================
# PLUGIN CONFIGURATION - Catppuccin (Mocha) — windows, panes, status
# ============================================================================

set -g @catppuccin_flavor 'mocha'

# Status bar: theme mantle background (set "none" for transparent)
set -g @catppuccin_status_background 'none'

# Window tabs — cleaner look for transparent status bars (less boxed than rounded)
set -g @catppuccin_window_status_style 'basic'
set -g @catppuccin_window_number_position 'left'
set -g @catppuccin_window_number '#I'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W#{?window_zoomed_flag,(󰁌),}'

# Pane borders — subtle inactive, mauve active (Catppuccin accent)
set -g @catppuccin_pane_border_style 'fg=#{@thm_overlay_0},bg=default'
set -g @catppuccin_pane_active_border_style 'fg=#{@thm_mauve},bg=default'

# Status modules — "yes" avoids #[bg=default] gaps between pills (fixes broken look on blur/wallpaper)
set -g @catppuccin_status_connect_separator 'yes'

# Directory chip: basename of path (same idea as #{b:pane_current_path})
set -g @catppuccin_directory_text ' #{b:pane_current_path}'

set -g status-position top
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_application}"

# Increase scrollback buffer size
set -g history-limit 10000

# ============================================================================
# INITIALIZE PLUGIN MANAGER
# ============================================================================

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'
